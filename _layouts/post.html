<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · evdc.me</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/syntax.css">
</head>
<body>
  <nav class="topbar" aria-label="Site">
    <a class="topbar-brand" href="/">evdc.me</a>
    <div class="topbar-links">
      <a href="https://github.com/evdc">GitHub</a>
      <a href="/blog.html">Blog</a>
      <a href="/readings.html">Reading list</a>
    </div>
  </nav>
  <div class="container">
    <header>
      <h1>evdc.me</h1>
      <p class="back-link">← <a href="/blog">All posts</a></p>
    </header>
    <article>
      <h2 class="post-title">{{ page.title }}</h2>
      <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
      <div class="post-content">
        {{ content }}
      </div>
    </article>
  </div>
  <script src="/topbar.js" defer></script>
</body>
</html>
